name: Trigger FraudGuard Processing Pipeline

on:
  push:
    paths:
      - 'Statement(1).pdf'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-python: '3.10'

      - name: Install Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf pandas numpy google-cloud-storage

      - name: Run Forensic Parsing Engine
        env:
          # If your app.py requires your local Google Credentials JSON string to write to GCS:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }} 
        run: |
          # This triggers your app parsing logic via a small runner script
          python -c "
          import sys
          # If you have a standalone parser script, you call it here. 
          # Otherwise, we can run your PDF parse layer directly.
          print('Processing Statement(1).pdf into Google Cloud Storage Vault...')
          "
          
          # If your pipeline script is inside app.py or a processing script, 
          # execute it here:
          # python processing_script.py
